---
name: Functional Tests

on: # yamllint disable-line rule:truthy
  push:
    branches: ["main"]
  pull_request:

permissions: {}

jobs:
  detect:
    name: ${{ matrix.provider }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: cloudmersive
            api-key: CLOUDMERSIVE_API_KEY
            threshold: 0.32
          - provider: deepai
            api-key: DEEPAI_API_KEY
            threshold: 0.39
          - provider: picpurify
            api-key: PICPURIFY_API_KEY
            threshold: 0.97
          - provider: sightengine
            api-user: SIGHTENGINE_API_USER
            api-key: SIGHTENGINE_API_SECRET
            threshold: 0.8
    steps:
      - name: Checkout ${{ github.repository }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Prepare API key
        id: secrets
        env:
          PROVIDER: ${{ matrix.provider }}
          SECRET_API_USER: ${{ secrets[matrix.api-user] }}
          SECRET_API_KEY: ${{ secrets[matrix.api-key] }}
        run: |
          if [ "$PROVIDER" = "sightengine" ]; then
            safe_key=$(printf '%s' "$SECRET_API_USER,$SECRET_API_KEY" | tr -d '\n\r')
          else
            safe_key=$(printf '%s' "$SECRET_API_KEY" | tr -d '\n\r')
          fi
          echo "api-key=$safe_key" >> "$GITHUB_OUTPUT"
      - name: Download test file
        run: |
          curl https://images-na.ssl-images-amazon.com/images/I/91cDPlxcRiL._SL1500_.jpg --output test.jpg
          git add test.jpg
      - name: Detect NSFW content
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: ${{ matrix.provider }}
          api_key: ${{ steps.secrets.outputs.api-key }}
          threshold: ${{ matrix.threshold }}
