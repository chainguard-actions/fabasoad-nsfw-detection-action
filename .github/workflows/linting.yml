---
name: Linting

on: # yamllint disable-line rule:truthy
  pull_request: {}
  push:
    branches:
      - main

permissions: {}

jobs:
  js-lint:
    name: JS Lint
    uses: fabasoad/reusable-workflows/.github/workflows/wf-js-lint.yml@5ebe0938b8d8ef97bbb051004c511ba78449a866 # main
  pre-commit:
    name: Pre-commit
    uses: fabasoad/reusable-workflows/.github/workflows/wf-pre-commit.yml@5ebe0938b8d8ef97bbb051004c511ba78449a866 # main
    with:
      skip-hooks: "audit, build, lint, test, snyk-test, grype-dir"
