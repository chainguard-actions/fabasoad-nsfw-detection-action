---
name: Test action with default optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: cloudmersive
          api_key: fake-api-key
          threshold: '0.5'
          # type and extensions use their defaults:
          # type: 'modified,added,renamed'
          # extensions: 'jpeg,jpg,png,gif,webp,tiff,bmp'
      - name: Assert action failed gracefully (no push payload under workflow_dispatch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because workflow_dispatch has no push payload
          # (no before/after SHAs), not because of a configuration error.
          # This verifies the action initializes with default inputs correctly.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no push payload), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at GitHub API stage (not at config stage)"
