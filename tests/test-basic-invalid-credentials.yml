name: Test NSFW Detection - Invalid Credentials (Expected Failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: fake-token
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run NSFW detection action (expect failure due to invalid credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-token
          provider: sightengine
          api_key: fake-api-key
          threshold: '0.5'

      - name: Assert action ran (failed due to invalid credentials, not config error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail due to API error,
          # but NOT due to a missing required input or misconfiguration.
          # Both 'success' and 'failure' are acceptable here — what matters
          # is that the action loaded and ran (not 'skipped' or a setup error).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
