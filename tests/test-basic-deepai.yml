name: Test basic deepai provider invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: fake-github-token
          provider: deepai
          api_key: fake-deepai-api-key
          threshold: '0.9'
          type: 'modified,added,renamed'
          extensions: 'jpg,jpeg,png'
      - name: Assert action failed due to invalid GitHub token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid GitHub token, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when using invalid GitHub token"
