---
name: Test invalid provider validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      SCAN_SCA_EXIT_CODE: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run NSFW detection action with invalid provider (expect failure)
        id: action
        uses: .
        with:
          provider: invalid-provider
          api-key: fake-api-key-for-testing
          threshold: 80
          extensions: jpeg,jpg,png,gif,webp,tiff,bmp
          types: added,copied,modified,renamed
        continue-on-error: true

      - name: Assert action failed due to invalid provider
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid provider, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid provider"
