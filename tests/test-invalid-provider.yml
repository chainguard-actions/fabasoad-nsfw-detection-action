---
name: Test invalid provider
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with invalid provider (expect failure)
        id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          provider: unsupported-provider
          api_key: fake-api-key
          threshold: '0.8'
        continue-on-error: true
      - name: Assert action failed with unsupported provider message
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unsupported provider, but outcome was $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported provider"
