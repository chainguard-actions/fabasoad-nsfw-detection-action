---
name: Test invalid provider error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: unknown-provider
          api_key: fake-api-key
          threshold: '0.9'
      - name: Assert action failed with invalid provider error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid provider, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for unknown provider"
