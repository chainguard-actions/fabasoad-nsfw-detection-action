---
name: Test invalid provider
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          provider: unknown-provider
          api-key: fake-api-key
          threshold: "0.8"
      - name: Assert action failed with unsupported provider error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for unsupported provider, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported provider"
