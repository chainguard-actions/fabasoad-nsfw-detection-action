---
name: Test invalid provider input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set SCAN_SCA_EXIT_CODE so validate-inputs step runs
        run: echo "SCAN_SCA_EXIT_CODE=0" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        env:
          SCAN_SCA_EXIT_CODE: "0"
        with:
          provider: invalid-provider
          api-key: fake-api-key
          threshold: "0.8"
      - name: Assert action failed due to invalid provider
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid provider, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid provider"
