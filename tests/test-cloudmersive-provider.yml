---
name: Test cloudmersive provider is recognized
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: cloudmersive
          api_key: fake-api-key
          threshold: '0.9'
          type: 'modified,added,renamed'
          extensions: 'jpeg,jpg,png,gif,webp,tiff,bmp'
      - name: Assert action failed for expected reason (not unsupported provider)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail (no push context), but NOT because of an
          # unsupported provider error. We just verify it fails (not succeeds
          # unexpectedly), confirming cloudmersive is a recognized provider.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no push context), but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: cloudmersive provider recognized; action failed as expected without push context"
