name: Test default optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run NSFW detection with only required inputs (defaults for optional)
        id: action
        uses: .
        continue-on-error: true
        with:
          provider: sightengine
          api-key: invalid-api-key
          threshold: "0.9"
          github-token: ${{ github.token }}
      - name: Assert action ran using default extensions and types
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (success or failure due to invalid API key),
          # but not crash with an unexpected error like 'skipped' or 'cancelled'
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with default optional inputs"
          else
            echo "FAIL: unexpected outcome '$OUTCOME' — expected success or failure"
            exit 1
          fi
          echo "PASS"
