---
name: Test valid provider fails gracefully without push context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: deepai
          api_key: fake-api-key
          threshold: '0.9'
          type: 'modified,added,renamed'
          extensions: 'jpeg,jpg,png,gif,webp,tiff,bmp'
      - name: Assert action failed due to missing push context
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without push context, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed without push event context"
