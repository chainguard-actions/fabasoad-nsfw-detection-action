name: Test all valid provider names are recognized
on:
  workflow_dispatch:
jobs:
  test-cloudmersive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-cloudmersive
        uses: .
        continue-on-error: true
        with:
          github_token: fake-github-token
          provider: cloudmersive
          api_key: fake-api-key
          threshold: '0.9'
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
      - name: Assert cloudmersive provider is recognized
        env:
          OUTCOME: ${{ steps.action-cloudmersive.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # If the provider were invalid, the action would fail with "cloudmersive provider is not supported"
          # immediately, before any API call. Since cloudmersive IS valid, it should fail only
          # when trying to call the GitHub API with a fake token (or succeed if no files found).
          # Either way, the outcome is acceptable — we just verify it ran past provider validation.
          echo "PASS: cloudmersive provider was recognized (action ran past provider validation)"

  test-picpurify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-picpurify
        uses: .
        continue-on-error: true
        with:
          github_token: fake-github-token
          provider: picpurify
          api_key: fake-api-key
          threshold: '0.9'
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
      - name: Assert picpurify provider is recognized
        env:
          OUTCOME: ${{ steps.action-picpurify.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "PASS: picpurify provider was recognized (action ran past provider validation)"

  test-sightengine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-sightengine
        uses: .
        continue-on-error: true
        with:
          github_token: fake-github-token
          provider: sightengine
          api_key: fake-api-key,fake-secret
          threshold: '0.9'
        env:
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/main
      - name: Assert sightengine provider is recognized
        env:
          OUTCOME: ${{ steps.action-sightengine.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "PASS: sightengine provider was recognized (action ran past provider validation)"
