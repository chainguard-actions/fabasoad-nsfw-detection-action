---
name: Test sightengine provider
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          provider: sightengine
          api-key: fake-api-key
          threshold: "0.7"
          extensions: jpeg,jpg,png
          types: added
      - name: Assert action failed gracefully (sightengine provider recognized)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without push event context, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: sightengine provider was recognized and action failed gracefully"
