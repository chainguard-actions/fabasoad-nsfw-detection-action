---
name: Test action fails gracefully without push payload
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          provider: deepai
          api_key: fake-api-key
          threshold: '0.8'
      - name: Assert action failed gracefully without push payload
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under workflow_dispatch, context.payload has no before/after SHAs,
          # so the GitHub API compareCommits call will fail or return no files.
          # The action should fail (not crash the runner) with a clear error.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without push payload, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without push event payload"
