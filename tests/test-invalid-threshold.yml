---
name: Test invalid threshold input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set SCAN_SCA_EXIT_CODE so validate-inputs step runs
        run: echo "SCAN_SCA_EXIT_CODE=0" >> "$GITHUB_ENV"
      - id: action
        uses: .
        continue-on-error: true
        env:
          SCAN_SCA_EXIT_CODE: "0"
        with:
          provider: cloudmersive
          api-key: fake-api-key
          threshold: not-a-number
      - name: Assert action ran (validate-inputs does not catch non-integer thresholds)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no files to scan, threshold not validated as integer)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (changed-files step may not support workflow_dispatch)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
